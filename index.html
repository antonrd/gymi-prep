<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gymi-Prep · Startseite</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .subjects {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .subject {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .subject-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .subject-title {
        font-size: clamp(1.2rem, 3.5vw, 1.6rem);
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .subject-icon {
        font-size: 1.6rem;
        line-height: 1;
      }
      /* Grid of big topic buttons; wraps and leaves room for more topics later. */
      .topic-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .topic-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px 22px;
        border: var(--border-w) solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
        text-decoration: none;
        color: var(--ink);
        transition: transform 0.08s ease, box-shadow 0.08s ease;
      }
      .topic-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 rgba(58, 47, 42, 0.18);
      }
      .topic-card:active {
        transform: translateY(1px);
        box-shadow: 0 2px 0 rgba(58, 47, 42, 0.16);
      }
      .topic-emoji {
        font-size: 2.2rem;
        line-height: 1;
        flex: 0 0 auto;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        border: var(--border-w) solid var(--line);
      }
      .topic-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .topic-name {
        font-weight: 800;
        font-size: 1.15rem;
      }
      .topic-sub {
        font-size: 0.85rem;
        color: var(--ink-soft);
        font-weight: 700;
      }
      /* Subject colour identities: Deutsch = coral (language/warmth),
         Mathematik = teal (numbers, matches the arithmetic trainer accent). */
      .subject--de .subject-icon,
      .subject--de .subject-title .accent {
        color: var(--coral-dark);
      }
      .subject--de .topic-emoji {
        background: var(--coral);
      }
      .subject--de .topic-card:hover {
        border-color: var(--coral-dark);
      }
      .subject--math .subject-icon,
      .subject--math .subject-title .accent {
        color: var(--teal-dark);
      }
      .subject--math .topic-emoji {
        background: var(--teal);
      }
      .subject--math .topic-card:hover {
        border-color: var(--teal-dark);
      }
      /* Placeholder tile hinting that more topics are coming. */
      .topic-card.soon {
        border-style: dashed;
        background: transparent;
        box-shadow: none;
        cursor: default;
        color: var(--ink-soft);
      }
      .topic-card.soon:hover {
        transform: none;
        box-shadow: none;
      }
      .topic-card.soon .topic-emoji {
        background: transparent;
        border-style: dashed;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1 class="app-title">Gymi&#8209;Prep <span class="accent">· Übungen</span></h1>
      </header>

      <div class="card wobble">
        <h2 class="panel-title">Wähle eine Übung</h2>
        <p class="panel-hint">Für die Vorbereitung auf die Aufnahmeprüfung ans Gymnasium.</p>

        <div class="subjects" style="margin-top: 18px;">
          <!-- ================= DEUTSCH ================= -->
          <section class="subject subject--de">
            <div class="subject-head">
              <span class="subject-icon">📖</span>
              <h3 class="subject-title">Deutsch<span class="accent"></span></h3>
            </div>
            <div class="topic-grid">
              <a class="topic-card" href="deutsch/connectors.html">
                <span class="topic-emoji">🔗</span>
                <span class="topic-text">
                  <span class="topic-name">Bindewörter</span>
                  <span class="topic-sub">Konjunktionen einsetzen</span>
                </span>
              </a>
              <div class="topic-card soon">
                <span class="topic-emoji">➕</span>
                <span class="topic-text">
                  <span class="topic-name">Bald mehr …</span>
                  <span class="topic-sub">weitere Übungen folgen</span>
                </span>
              </div>
            </div>
          </section>

          <!-- ================= MATHEMATIK ================= -->
          <section class="subject subject--math">
            <div class="subject-head">
              <span class="subject-icon">🧮</span>
              <h3 class="subject-title">Mathematik<span class="accent"></span></h3>
            </div>
            <div class="topic-grid">
              <a class="topic-card" href="math/zahlenreihen.html">
                <span class="topic-emoji">🔢</span>
                <span class="topic-text">
                  <span class="topic-name">Zahlenreihen</span>
                  <span class="topic-sub">Kopfrechnen in Ketten</span>
                </span>
              </a>
              <div class="topic-card soon">
                <span class="topic-emoji">➕</span>
                <span class="topic-text">
                  <span class="topic-name">Bald mehr …</span>
                  <span class="topic-sub">weitere Übungen folgen</span>
                </span>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
